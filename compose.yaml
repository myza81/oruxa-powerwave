# Portable Powerwave base configuration.
#
# This file must run unchanged on Windows, macOS and Linux. It therefore
# contains no host paths, no host ports, no UID/GID assumptions, no external
# networks and no project identity. Everything environment-specific lives in
# compose.dev.yaml / compose.prod.yaml, which also carry the Compose project
# name that keeps DEV and PROD isolated on a shared host.
#
#   DEV:  docker compose -f compose.yaml -f compose.dev.yaml up -d
#   PROD: docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# Container names are deliberately not set: Compose derives them from the
# project name, so both environments can run side by side.

services:
  frontend:
    # Tags are target-qualified. The project name isolates containers, networks
    # and volumes; without TARGET here the image tag would stay a shared mutable
    # resource that DEV and PROD could overwrite for each other. deploy.sh
    # exports TARGET, so this always resolves to dev-* or prod-*.
    image: powerwave-frontend:${TARGET:-local}-${APP_VERSION:-local}

    build:
      context: ./frontend

    restart: unless-stopped

    # Phase 4A-UAT3: the SAME APP_VERSION already used above to tag this
    # image, also passed through as a runtime env var so the entrypoint
    # (frontend/docker-entrypoint.d/10-powerwave-config.sh) can write it
    # into config.js -- one source of truth for both the image tag and the
    # frontend's own build-provenance marker, never a second, separately
    # maintained version string. ENVIRONMENT is already provided by each
    # overlay (compose.dev.yaml/compose.prod.yaml); merged here alongside it.
    environment:
      APP_VERSION: ${APP_VERSION:-local}

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    image: powerwave-backend:${TARGET:-local}-${APP_VERSION:-local}

    build:
      context: ./backend

    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/data}
      # Phase 4A-UAT3: same source of truth as the frontend's own
      # APP_VERSION above (and the image tag both services already use) --
      # never a second, independently-maintained version value. Read by
      # app.config.load_settings() and exposed on GET /health.
      APP_VERSION: ${APP_VERSION:-local}

    volumes:
      # A named volume is the portable default. Compose scopes it to the
      # project, so DEV and PROD get separate volumes from the same definition.
      # Each overlay may substitute a host path.
      - powerwave-data:/data

    healthcheck:
      # Uses the interpreter already in the image so the runtime needs no curl.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health")
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  powerwave-data:
