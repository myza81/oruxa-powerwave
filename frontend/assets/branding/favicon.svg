<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Oruxa Powerwave favicon">
  <defs>
    <linearGradient id="bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1736"/>
      <stop offset="1" stop-color="#152A5B"/>
    </linearGradient>
    <linearGradient id="wave" x1="12" y1="32" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35D0FF"/>
      <stop offset="1" stop-color="#78F3C8"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bg)"/>

  <!-- Subtle inner border for definition on dark browser chrome -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="12.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- Power waveform -->
  <path d="M11 34
           H19
           L24 22
           L30 44
           L36 17
           L42 39
           L47 29
           H53"
        fill="none"
        stroke="url(#wave)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Signal endpoint -->
  <circle cx="53" cy="29" r="3.2" fill="#78F3C8"/>
</svg>
