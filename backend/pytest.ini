[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
markers =
    ben_reference: validates the BEN parser against real owner BEN records and their BEN32 COMTRADE exports (not committed); skipped unless --ben-reference-dir or POWERWAVE_BEN_REFERENCE_DIR is set
    slow: marks tests as slow-running performance benchmarks (run with -m slow to include)
